name: Container Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to publish, never latest"
        required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "10.23.0"
  IMAGE_NAME: ghcr.io/agrismartchain/noki-operations
  PACKAGE_OWNER: Agrismartchain
  PACKAGE_NAME: noki-operations
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse latest tag
        run: |
          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "The latest tag is forbidden."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@agrismartchain"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        env:
          NOKI_API_BASE_URL: https://api-staging.noki-services.com
        run: pnpm check

      - name: Verify target GHCR package is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          if [ "${visibility}" != "private" ]; then
            echo "Container package ${PACKAGE_NAME} must already exist and be private before push."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Push image with SBOM and provenance
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          sbom: true
          provenance: true
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Print immutable digest
        run: echo "Image digest: ${{ steps.push.outputs.digest }}"
