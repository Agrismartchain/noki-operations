name: Container Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to publish, never latest"
        required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "10.23.0"
  IMAGE_NAME: ghcr.io/agrismartchain/noki-operations
  PACKAGE_OWNER: Agrismartchain
  PACKAGE_NAME: noki-operations
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse latest tag
        run: |
          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "The latest tag is forbidden."
            exit 1
          fi
          if [ "${{ inputs.image_tag }}" != "${GITHUB_SHA}" ]; then
            echo "image_tag must equal the full commit SHA being built (${GITHUB_SHA}) so the OCI revision label, the tag and the release lock agree."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@agrismartchain"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        env:
          NOKI_API_BASE_URL: https://api-staging.noki-services.com
        run: pnpm check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The packages REST API does not accept GITHUB_TOKEN and /orgs/... 404s for
      # personal accounts, so privacy is proven at the registry instead:
      # the package must be readable with the workflow token (it exists and is
      # linked to this repo) AND refused to an anonymous client. A bare 401/404
      # is never treated as proof: the authenticated read must succeed first.
      - name: Write GHCR privacy probe
        run: |
          cat > "${RUNNER_TEMP}/ghcr-privacy-probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          # usage: ghcr-privacy-probe.sh <tag|first> [expected-digest] [require-attestations 0|1]
          # Fail-closed. No -f on curl: every HTTP code is captured, printed and judged explicitly.
          set -uo pipefail
          repo="$(echo "${PACKAGE_OWNER}/${PACKAGE_NAME}" | tr 'A-Z' 'a-z')"
          ref="${1:?tag}"; expected="${2:-}"; require_att="${3:-0}"
          work="$(mktemp -d)"; trap 'rm -rf "${work}"' EXIT
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json'
          tokurl="https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull"
          CODE=000
          fail() { echo "::error::$*"; exit 1; }
          req() { # req <name> <curl args...> -> CODE, ${work}/<name>.{body,hdr}
            local n="$1"; shift
            CODE="$(curl -sS --max-time 30 -o "${work}/${n}.body" -D "${work}/${n}.hdr" -w '%{http_code}' "$@" 2>"${work}/${n}.err")" || CODE=000
          }
          hdr() { tr -d '\r' < "${work}/$1.hdr" | awk -F': ' -v k="$2" 'tolower($1)==k{print $2; exit}'; }
          errcode() { jq -r '[.errors[]?.code] | join(",")' "${work}/$1.body" 2>/dev/null; }
          echo "package=ghcr.io/${repo} requested_ref=${ref}"

          # 1. authenticated token exchange (workflow GITHUB_TOKEN only)
          req auth_tok -u "${GITHUB_ACTOR}:${GH_TOKEN}" "${tokurl}"
          echo "AUTH_TOKEN_EXCHANGE_HTTP=${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "auth token exchange error codes: $(errcode auth_tok)"
            fail "Authenticated token exchange refused (HTTP ${CODE}). STOP: the workflow token cannot read this package; verify the package's 'Manage Actions access' manually."
          fi
          auth_bearer="$(jq -r '.token // empty' "${work}/auth_tok.body")"
          [ -n "${auth_bearer}" ] || fail "Authenticated token exchange returned no token."
          echo "::add-mask::${auth_bearer}"

          # 2. anonymous token exchange: 401/403 is the expected denial for a private package, 200 is inspected below
          req anon_tok "${tokurl}"
          echo "ANON_TOKEN_EXCHANGE_HTTP=${CODE} codes=$(errcode anon_tok)"
          anon_tok_code="${CODE}"; anon_bearer=""
          case "${anon_tok_code}" in
            200) anon_bearer="$(jq -r '.token // empty' "${work}/anon_tok.body")"
                 [ -z "${anon_bearer}" ] || echo "::add-mask::${anon_bearer}" ;;
            401|403) case "$(errcode anon_tok)" in *UNAUTHORIZED*|*DENIED*|*FORBIDDEN*) ;; *) fail "Anonymous token exchange ${anon_tok_code} without a recognised registry error code (ambiguous)." ;; esac ;;
            *) fail "Anonymous token exchange returned HTTP ${anon_tok_code} (ambiguous or transport error)." ;;
          esac

          # 3. resolve the reference (authenticated)
          if [ "${ref}" = "first" ]; then
            req tags -H "Authorization: Bearer ${auth_bearer}" "https://ghcr.io/v2/${repo}/tags/list"
            echo "AUTH_TAGS_HTTP=${CODE}"
            [ "${CODE}" = "200" ] || fail "Authenticated tag list failed (HTTP ${CODE}): package missing or not readable by the workflow token."
            ref="$(jq -r '[.tags[]? | select(startswith("sha256-") | not)][0] // empty' "${work}/tags.body")"
            [ -n "${ref}" ] || fail "Authenticated tag list is empty: no published tag to probe."
            echo "probed_tag=${ref}"
          fi

          # 4. authenticated manifest read must be 200 before anything is concluded about privacy
          murl() { echo "https://ghcr.io/v2/${repo}/manifests/$1"; }
          req auth_man -H "Accept: ${accept}" -H "Authorization: Bearer ${auth_bearer}" "$(murl "${ref}")"
          echo "AUTH_MANIFEST_HTTP=${CODE}"
          [ "${CODE}" = "200" ] || fail "Authenticated manifest read failed (HTTP ${CODE}); privacy is unproven."
          digest="$(hdr auth_man docker-content-digest)"
          mtype="$(jq -r '.mediaType // empty' "${work}/auth_man.body")"
          echo "registry_digest=${digest} mediaType=${mtype}"
          [ -n "${digest}" ] || fail "Registry returned no Docker-Content-Digest."
          if [ -n "${expected}" ] && [ "${digest}" != "${expected}" ]; then
            fail "Registry digest ${digest} != published digest ${expected}."
          fi

          # 5. OCI index / attestation manifests
          att_digest=""; att_count=0
          case "${mtype}" in
            *image.index*|*manifest.list*)
              n="$(jq '.manifests | length' "${work}/auth_man.body")"
              att_count="$(jq '[.manifests[] | select(.annotations["vnd.docker.reference.type"]=="attestation-manifest")] | length' "${work}/auth_man.body")"
              att_digest="$(jq -r '[.manifests[] | select(.annotations["vnd.docker.reference.type"]=="attestation-manifest")][0].digest // empty' "${work}/auth_man.body")"
              echo "index manifests=${n} attestation_manifests=${att_count}" ;;
            *) echo "single manifest (not an index)" ;;
          esac
          if [ "${require_att}" = "1" ] && [ "${att_count}" -lt 1 ]; then
            fail "No attestation manifest (SBOM/provenance) found in the published index."
          fi

          # 6. anonymous reads of the SAME package/manifest (and the attestation child)
          anon_check() { # <label> <manifest-ref>
            local label="$1" mref="$2"
            req auth_chk -H "Accept: ${accept}" -H "Authorization: Bearer ${auth_bearer}" "$(murl "${mref}")"
            [ "${CODE}" = "200" ] || fail "[${label}] authenticated read of ${mref} failed (HTTP ${CODE})."
            req nb -H "Accept: ${accept}" "$(murl "${mref}")"
            local nb="${CODE}" ab="n/a"
            echo "ANON_MANIFEST_HTTP[${label}] no-bearer=${nb}"
            case "${nb}" in
              200) fail "[${label}] anonymously readable without credentials: package is PUBLIC." ;;
              401) hdr nb www-authenticate | grep -q "repository:${repo}:" \
                     || fail "[${label}] 401 challenge does not reference repository:${repo} (not tied to this package)." ;;
              *) fail "[${label}] anonymous no-bearer read returned HTTP ${nb} (ambiguous)." ;;
            esac
            if [ -n "${anon_bearer}" ]; then
              req ab -H "Accept: ${accept}" -H "Authorization: Bearer ${anon_bearer}" "$(murl "${mref}")"
              ab="${CODE}"
              echo "ANON_MANIFEST_HTTP[${label}] anon-bearer=${ab} codes=$(errcode ab)"
              case "${ab}" in
                200) fail "[${label}] readable with an anonymous bearer: package is PUBLIC." ;;
                401|403) case "$(errcode ab)" in *UNAUTHORIZED*|*DENIED*|*FORBIDDEN*) ;; *) fail "[${label}] anonymous denial without a registry error code (ambiguous)." ;; esac ;;
                *) fail "[${label}] anonymous-bearer read returned HTTP ${ab} (ambiguous)." ;;
              esac
            else
              echo "[${label}] no anonymous bearer was issued (token exchange ${anon_tok_code}): denial established at the token service for repository:${repo}:pull"
            fi
          }
          anon_check "ref" "${ref}"
          [ -z "${att_digest}" ] || anon_check "attestation" "${att_digest}"

          echo "PRIVATE_PROOF=OK authenticated_manifest=200 anon_token=${anon_tok_code} anon_manifest_no_bearer=401(scoped to repository:${repo}) digest=${digest}"
          {
            echo "### GHCR privacy probe (${GITHUB_JOB:-job})"
            echo "- package: \`ghcr.io/${repo}\` ref: \`${ref}\`"
            echo "- digest: \`${digest}\` attestations: ${att_count}"
            echo "- auth token exchange 200, anonymous token exchange ${anon_tok_code}, authenticated manifest 200"
            echo "- result: PRIVATE_PROOF=OK"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          PROBE
          chmod +x "${RUNNER_TEMP}/ghcr-privacy-probe.sh"

      - name: Verify target GHCR package is private (pre-push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${RUNNER_TEMP}/ghcr-privacy-probe.sh first"

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Push image with SBOM and provenance
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.title=noki-operations
            org.opencontainers.image.licenses=UNLICENSED
          sbom: true
          provenance: true
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR package is still private and digest matches (post-push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${RUNNER_TEMP}/ghcr-privacy-probe.sh '${{ inputs.image_tag }}' '${{ steps.push.outputs.digest }}' 1"

      - name: Print immutable digest
        run: |
          echo "Image digest: ${{ steps.push.outputs.digest }}"
