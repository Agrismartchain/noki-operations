name: Container Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to publish, never latest"
        required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  NODE_VERSION: "24.18.0"
  PNPM_VERSION: "10.23.0"
  IMAGE_NAME: ghcr.io/agrismartchain/noki-operations
  PACKAGE_OWNER: Agrismartchain
  PACKAGE_NAME: noki-operations
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse latest tag
        run: |
          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "The latest tag is forbidden."
            exit 1
          fi
          if [ "${{ inputs.image_tag }}" != "${GITHUB_SHA}" ]; then
            echo "image_tag must equal the full commit SHA being built (${GITHUB_SHA}) so the OCI revision label, the tag and the release lock agree."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@agrismartchain"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        env:
          NOKI_API_BASE_URL: https://api-staging.noki-services.com
        run: pnpm check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The packages REST API does not accept GITHUB_TOKEN and /orgs/... 404s for
      # personal accounts, so privacy is proven at the registry instead:
      # the package must be readable with the workflow token (it exists and is
      # linked to this repo) AND refused to an anonymous client. A bare 401/404
      # is never treated as proof: the authenticated read must succeed first.
      - name: Write GHCR privacy probe
        run: |
          cat > "${RUNNER_TEMP}/ghcr-privacy-probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          # usage: ghcr-privacy-probe.sh <tag-or-"first"> [expected-digest]
          set -euo pipefail
          repo="$(echo "${PACKAGE_OWNER}/${PACKAGE_NAME}" | tr 'A-Z' 'a-z')"
          ref="${1:?tag}"
          expected="${2:-}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json'
          tok() { curl -fsS "$@" "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -r '.token'; }
          auth_token="$(tok -u "${GITHUB_ACTOR}:${GH_TOKEN}")"
          anon_token="$(tok)"
          if [ "${ref}" = "first" ]; then
            ref="$(curl -fsS -H "Authorization: Bearer ${auth_token}" "https://ghcr.io/v2/${repo}/tags/list" | jq -r '.tags[0] // empty')"
            [ -n "${ref}" ] || { echo "::error::Authenticated tag list is empty or unreadable: package missing or not accessible to GITHUB_TOKEN."; exit 1; }
          fi
          url="https://ghcr.io/v2/${repo}/manifests/${ref}"
          hdr="$(mktemp)"
          auth_code="$(curl -sS -o /dev/null -D "${hdr}" -w '%{http_code}' -H "Accept: ${accept}" -H "Authorization: Bearer ${auth_token}" "${url}")"
          digest="$(tr -d '\r' < "${hdr}" | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')"
          anon_code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Accept: ${accept}" -H "Authorization: Bearer ${anon_token}" "${url}")"
          anon_nobearer="$(curl -sS -o /dev/null -w '%{http_code}' -H "Accept: ${accept}" "${url}")"
          echo "package=${repo} ref=${ref}"
          echo "authenticated_manifest_http=${auth_code} digest=${digest}"
          echo "anonymous_manifest_http=${anon_code} (no-bearer=${anon_nobearer})"
          if [ "${auth_code}" != "200" ]; then
            echo "::error::Authenticated read failed (${auth_code}); cannot establish that the package exists, so privacy is unproven."
            exit 1
          fi
          if [ "${anon_code}" = "200" ] || [ "${anon_nobearer}" = "200" ]; then
            echo "::error::Package is anonymously readable (public). Refusing."
            exit 1
          fi
          if [ -n "${expected}" ] && [ "${digest}" != "${expected}" ]; then
            echo "::error::Registry digest ${digest} != pushed digest ${expected}."
            exit 1
          fi
          echo "PRIVATE_PROOF: readable with workflow token (200), refused anonymously (${anon_code})."
          PROBE
          chmod +x "${RUNNER_TEMP}/ghcr-privacy-probe.sh"

      - name: Verify target GHCR package is private (pre-push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${RUNNER_TEMP}/ghcr-privacy-probe.sh first"

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Push image with SBOM and provenance
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.title=noki-operations
            org.opencontainers.image.licenses=UNLICENSED
          sbom: true
          provenance: true
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR package is still private and digest matches (post-push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${RUNNER_TEMP}/ghcr-privacy-probe.sh '${{ inputs.image_tag }}' '${{ steps.push.outputs.digest }}'"

      - name: Print immutable digest
        run: |
          echo "Image digest: ${{ steps.push.outputs.digest }}"
