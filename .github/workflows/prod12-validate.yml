name: PROD-16 auth-origin validation (throwaway, never merge, never pushes images)

on:
  push:
    branches: ["tmp/prod-16-validate"]

permissions:
  contents: read
  packages: read

env:
  PNPM_VERSION: "10.23.0"
  NODE_VERSION: "24.18.0"
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scan:
    name: Auth origin fix
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper scripts
        uses: actions/checkout@v4
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: security/prod-16-auth-origin
          path: target
          persist-credentials: false
      - run: git -C target log --oneline -1
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@agrismartchain"
      - name: Frozen install + lint + typecheck + tests + build (after only)
        working-directory: target
        env:
          NOKI_API_BASE_URL: https://api-staging.noki-services.com
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm ls next eslint-config-next react next-intl --depth 0
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (linux/amd64, secret npm token, load only, no push)
        uses: docker/build-push-action@v6
        with:
          context: target
          file: target/Dockerfile
          platforms: linux/amd64
          load: true
          tags: noki-ops:test
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - name: Real-container reverse-proxy origin test (HTTPS nginx -> app:3000)
        run: bash .prod16/proxytest.sh
