name: PROD-12B distroless validation (throwaway, never merge, never pushes images)

on:
  push:
    branches: ["tmp/prod-12b-validate"]

permissions:
  contents: read
  packages: read

env:
  PNPM_VERSION: "10.23.0"
  NODE_VERSION: "24.18.0"
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scan:
    name: DISTROLESS variant
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper scripts
        uses: actions/checkout@v4
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: security/prod-12b-distroless
          path: target
          persist-credentials: false
      - run: git -C target log --oneline -1
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@agrismartchain"
      - name: Frozen install + lint + typecheck + tests + build (after only)
        working-directory: target
        env:
          NOKI_API_BASE_URL: https://api-staging.noki-services.com
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm ls next eslint-config-next react next-intl --depth 0
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (linux/amd64, secret npm token, load only, no push)
        uses: docker/build-push-action@v6
        with:
          context: target
          file: target/Dockerfile
          platforms: linux/amd64
          load: true
          tags: noki-ops:test
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
      - name: Image facts (no shell in image)
        run: |
          docker image inspect noki-ops:test --format 'user={{.Config.User}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} healthcheck={{json .Config.Healthcheck}}'
          docker run --rm noki-ops:test -v
          docker run --rm noki-ops:test -e "console.log('uid',process.getuid(),'gid',process.getgid(),'node',process.version,'openssl',process.versions.openssl)"
          echo "--- shell must be absent"; docker run --rm --entrypoint /bin/sh noki-ops:test -c true && echo "SHELL PRESENT" || echo "no shell (expected)"
          for b in npm npx corepack yarn; do docker run --rm --entrypoint "/usr/local/bin/$b" noki-ops:test >/dev/null 2>&1 && echo "$b PRESENT" || echo "$b absent"; done
          echo "--- HTTPS from runtime (CA bundle)"
          docker run --rm noki-ops:test -e "fetch('https://github.com').then(r=>console.log('HTTPS github.com status',r.status)).catch(e=>{console.log('HTTPS FAIL',e.cause&&e.cause.code||e.message);process.exit(1)})"
          echo "--- native modules (sharp) if bundled"
          docker run --rm -w /app noki-ops:test -e "let ok=false;try{const s=require('sharp');console.log('sharp',s.versions&&s.versions.sharp);ok=true}catch(e){console.log('sharp not loadable/bundled:',e.code||e.message)}"
      - name: Container health check (real)
        run: |
          docker run -d --name noki -p 3000:3000 -e NOKI_API_BASE_URL=https://api-staging.noki-services.com noki-ops:test
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' noki); echo "health=$s (t=$((i*5))s)"
            [ "$s" = "healthy" ] && break
            [ "$s" = "unhealthy" ] && break
            sleep 5
          done
          echo "--- GET /api/health"; curl -sS -m 10 -w '\nHTTP %{http_code}\n' http://127.0.0.1:3000/api/health
          echo "--- process user"; docker exec noki /nodejs/bin/node -e "console.log('runtime uid',process.getuid(),'node',process.version)"; docker top noki -eo user,pid,args || true
          docker logs noki 2>&1 | tail -15
          [ "$(docker inspect --format '{{.State.Health.Status}}' noki)" = "healthy" ]
      - name: Trivy scan (JSON, HIGH/CRITICAL, no ignore-unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: noki-ops:test
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Classified summary
        run: python3 .prod12/summarize.py trivy.json "DISTROLESS"
      - name: Policy gate (identical settings to container-image.yml)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: noki-ops:test
          severity: CRITICAL,HIGH
          exit-code: "1"
